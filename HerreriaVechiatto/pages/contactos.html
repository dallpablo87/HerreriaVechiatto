<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Herrería Vechiatto</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="header-principal">
        <img class="logo-header" src="../asests/imagen/logo e-commerce.png" alt="logo del negocio">
        <nav>
            <ul class="menu-navegacion">
                <li class="item-navegacion"><a href="../index.html" class="enlace-navegacion">Inicio</a></li>
                <li class="item-navegacion"><a href="productos.html" class="enlace-navegacion">Proyectos</a></li>
                <li class="item-navegacion"><a href="servicios.html" class="enlace-navegacion">Servicios</a></li>
                <li class="item-navegacion"><a href="contactos.html" class="enlace-navegacion">Contacto</a></li>
                <li class="item-navegacion"><a href="nosotros.html" class="enlace-navegacion">Nosotros</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-principal">
        <section class="seccion-destacada">
            <h1>Contáctanos</h1>
            <p class="parrafo">Envíanos tu consulta o solicita un presupuesto sin compromiso.</p>
            
            <form action="#">
                <div>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                </div>
                <div>
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                </div>
                <div>
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu consulta aquí..."></textarea>
                </div>
                <button type="submit">Enviar Consulta</button>
            </form>
        </section>
    </main>

    <footer class="footer-principal">
        <nav>
            <ul class="redes-sociales">
                <li class="item-redes">
                    <a href="https://www.facebook.com/vechiattoherreria/?locale=es_LA" target="_blank" rel="noopener noreferrer">
                        <img src="../asests/logos de redes/icons8-facebook-50.png" alt="Logo de Facebook" class="icono-redes">
                    </a>
                </li>
                <li class="item-redes">
                    <a href="https://www.instagram.com/vechiattoherreria/?hl=es" target="_blank" rel="noopener noreferrer">
                        <img src="../asests/logos de redes/icons8-instagram-50.png" alt="Logo de Instagram" class="icono-redes">
                    </a>
                </li>
            </ul>
        </nav>
        <p class="texto-footer">&copy; 2026 Herrería Vechiatto - Todos los derechos reservados.</p>
    </footer>
</body>
</html>
